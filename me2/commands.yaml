# AI 231 ME2 - Voice Command Model
# The command set the class agreed on, airimonda/ai231-me2-voice-commands on
# Hugging Face: 19 commands with three phrasings each and three values per
# slot - 93 variations - plus `none` for the dataset's OUT_OF_SCOPE. Calls,
# messages and reminders are commands too: the dataset defines them as closed
# phrases, so a classifier needs no transcript to tell them apart.
#
# Values are exactly the dataset's slot_value strings (its variations.csv).
# `schema` lists the dataset's phrasings, for reference; training reads the
# recordings, not templates. add_class_dataset.py builds the data.

version: 1

audio:
  sample_rate: 16000
  max_duration_s: 6.0

slots:
  duration:
    values: ["10 seconds", "30 seconds", "1 minute"]
  time:
    values: ["6:00 AM", "8:00 AM", "9:00 PM"]
  degrees:
    values: ["18 degrees", "22 degrees", "26 degrees"]
  percent:
    values: ["20 percent", "60 percent", "100 percent"]
  color:
    values: ["Red", "Blue", "Green"]
  task:
    values: ["Drink water", "Study", "Exercise"]

intents:
  PLAY_MUSIC:
    slots: []
    schema: ["play music", "start music", "play some music"]
  WEATHER:
    slots: []
    schema: ["weather", "what's the weather", "tell me the weather"]
  TIME:
    slots: []
    schema: ["time", "what time is it", "tell me the time"]
  LIGHT_ON:
    slots: []
    schema: ["lights on", "power on the lights", "turn on the lights"]
  LIGHT_OFF:
    slots: []
    schema: ["lights out", "kill the lights", "shut off the lights"]
  PAUSE:
    slots: []
    schema: ["pause", "pause audio", "pause song"]
  STOP:
    slots: []
    schema: ["stop", "stop playing", "end playback"]
  NEXT:
    slots: []
    schema: ["next song", "skip song", "play next song"]
  VOLUME_UP:
    slots: []
    schema: ["volume up", "increase the volume", "turn the volume up"]
  VOLUME_DOWN:
    slots: []
    schema: ["volume down", "lower the volume", "turn the volume down"]
  CALL:
    slots: []
    schema: ["call", "make a call", "make a phone call"]
  MESSAGE:
    slots: []
    schema: ["message", "send a message", "send my message"]
  LIST_REMINDERS:
    slots: []
    schema: ["reminders", "show my reminders", "list my reminders"]
  TIMER:
    slots: [duration]
    schema: ["timer {duration}", "countdown for {duration}", "start a timer for {duration}"]
  ALARM:
    slots: [time]
    schema: ["alarm {time}", "wake me up at {time}", "set an alarm for {time}"]
  TEMPERATURE:
    slots: [degrees]
    schema: ["temperature {degrees}", "change the temperature to {degrees}", "set the temperature to {degrees}"]
  BRIGHTNESS:
    slots: [percent]
    schema: ["brightness {percent}", "adjust brightness to {percent}", "brightness level {percent}"]
  COLOR:
    slots: [color]
    schema: ["change color to {color}", "switch color to {color}", "set color to {color}"]
  CREATE_REMINDER:
    slots: [task]
    schema: ["reminder {task}", "remind me to {task}", "create a reminder to {task}"]
  none:
    slots: []
